# ==============================================================================
# FEATURE ENGINEERING & PREPROCESSING CONFIGURATION
# Sửa giá trị (true / false) bên dưới để bật hoặc tắt bất kỳ đặc trưng nào (Ablations)
# ==============================================================================

# 1. BẬT / TẮT CÁC MÔ-ĐUN CHÍNH (High-level Module Toggles)
modules:
  enable_skewness: true             # Biến đổi Log1p, Zero-balance hurdle, Yeo-Johnson
  enable_scaling: true              # Chuẩn hóa RobustScaler & StandardScaler
  enable_domain_features: true      # Tạo các đặc trưng nghiệp vụ ngân hàng
  enable_one_hot_encoding: true     # One-Hot Encoding cho các cột phân loại
  enable_target_encoding: true      # Smoothed Target Encoding (m-estimate)
  enable_smote: true                # Cân bằng mẫu thiểu số bằng SMOTE trên tập Train
  enable_feature_selection: false   # Lọc đặc trưng Top-K theo độ quan trọng

# 2. CHI TIẾT BIẾN ĐỔI PHÂN PHỐI LỆCH (Skewness Transformation Sub-toggles)
skewness_transform:
  transform_trans_amount_log: true  # log_trans_amount_3m = log1p(trans_amount_3m)
  transform_recency_log: true       # log_recency_days = log1p(recency_days)
  zero_balance_hurdle: true         # is_zero_balance & log_positive_balance
  transform_yeo_johnson: true       # yj_trans_amount_3m (Yeo-Johnson power transform)

# 3. CHI TIẾT CHUẨN HÓA (Scaling Sub-toggles & Feature Lists)
scaling:
  apply_robust_scaling: true        # RobustScaler (Median & IQR) cho transactional metrics
  apply_standard_scaling: true      # StandardScaler (Mean & Std) cho demographic metrics
  robust_features:
    - recency_days
    - monthly_transactions
    - trans_amount_3m
    - trans_trend_ratio
    - app_logins_monthly
  standard_features:
    - age
    - credit_score
    - estimated_salary
    - tenure

# 4. CHI TIẾT ĐẶC TRƯNG NGHIỆP VỤ (Domain Features Sub-groups)
domain_features:
  # Momentum: interaction_velocity, is_spending_collapsing, avg_ticket_size, app_to_trans_ratio
  enable_behavioral_momentum: true

  # Customer friction: friction_index, is_high_friction
  enable_customer_friction: true

  # Bundling non-linear: is_product_sweetspot (== 2), is_product_danger_zone (>= 3)
  enable_product_bundling: true

  # Interaction terms: wealth_deceleration_risk, germany_high_balance, is_middle_aged_vulnerable
  enable_risk_interactions: true

# 5. CHI TIẾT MÃ HÓA DANH MỤC (Categorical Encoding Configuration)
categorical_encoding:
  categorical_cols:
    - country
    - gender
    - preferred_channel
    - primary_device
  target_encoding_m_weight: 10.0    # Trọng số m-estimate smoothing: S_i = (n*mean + m*global) / (n + m)
  ohe_drop_first: false

# 6. CHI TIẾT CÂN BẰNG LỚP (Class Balancing / SMOTE Configuration)
balancing:
  smote_sampling_strategy: "auto"
  smote_k_neighbors: 5

# 7. CHI TIẾT LỰA CHỌN ĐẶC TRƯNG (Feature Selection Configuration)
feature_selection:
  top_k_features: null              # Số lượng đặc trưng giữ lại (e.g. 15, 25, hoặc null để giữ tất cả)
  feature_selection_metric: "RF_Importance"  # "RF_Importance" hoặc "MI_Score"
  compute_feature_importance: false # Tính điểm quan trọng MI + Random Forest khi chạy pipeline

# 8. CẤU HÌNH DATASET & CHIA TRAIN/TEST (Dataset & Partition Settings)
dataset:
  target_col: "churn"
  test_size: 0.20
  random_state: 42
  stratify: true
  exclude_cols:
    - customer_id
    - churn
    - country
    - gender
    - preferred_channel
    - primary_device
    - yj_trans_amount_3m
