# ==============================================================================
# UNIFIED CONFIGURATION: FEATURE ENGINEERING & MODELS
# ==============================================================================

# 1. CẤU HÌNH DỮ LIỆU & PHÂN CHIA TRAIN/TEST (Dataset & Partition Settings)
dataset:
  data_path: "data/cleaned_bank_data.csv"
  target_col: "churn"
  test_size: 0.20
  random_state: 42
  stratify: true
  exclude_cols:
    - customer_id
    - churn
    - country
    - gender
    - preferred_channel
    - primary_device
    - yj_trans_amount_3m

# 2. CẤU HÌNH KỸ NGHỆ ĐẶC TRƯNG (Feature Engineering Settings)
features:
  # Bật/tắt các mô-đun chính (High-level Module Toggles for Ablation)
  enable_skewness: true             # Biến đổi Log1p, Zero-balance hurdle, Yeo-Johnson
  enable_scaling: true              # Chuẩn hóa RobustScaler & StandardScaler
  enable_domain_features: true      # Tạo các đặc trưng nghiệp vụ ngân hàng
  enable_one_hot_encoding: true     # One-Hot Encoding cho các cột phân loại
  enable_target_encoding: true      # Smoothed Target Encoding (m-estimate)
  enable_smote: true                # Cân bằng mẫu thiểu số bằng SMOTE trên tập Train
  enable_feature_selection: false   # Lọc đặc trưng Top-K theo độ quan trọng

  # Chi tiết biến đổi phân phối lệch (Skewness sub-toggles)
  skewness_transform:
    transform_trans_amount_log: true
    transform_recency_log: true
    zero_balance_hurdle: true
    transform_yeo_johnson: true

  # Chi tiết chuẩn hóa (Scaling sub-toggles)
  scaling:
    apply_robust_scaling: true
    apply_standard_scaling: true
    robust_features:
      - recency_days
      - monthly_transactions
      - trans_amount_3m
      - trans_trend_ratio
      - app_logins_monthly
    standard_features:
      - age
      - credit_score
      - estimated_salary
      - tenure

  # Chi tiết đặc trưng nghiệp vụ (Domain features sub-groups)
  domain_features:
    enable_behavioral_momentum: true  # velocity, spending collapsing, ticket size, app logins ratio
    enable_customer_friction: true    # friction_index, is_high_friction
    enable_product_bundling: true     # is_product_sweetspot, is_product_danger_zone
    enable_risk_interactions: true    # wealth_deceleration_risk, germany_high_balance, middle-aged

  # Chi tiết mã hóa danh mục (Categorical encoding)
  categorical_encoding:
    categorical_cols:
      - country
      - gender
      - preferred_channel
      - primary_device
    target_encoding_m_weight: 10.0
    ohe_drop_first: false

  # Chi tiết cân bằng lớp (Class balancing / SMOTE)
  balancing:
    smote_sampling_strategy: "auto"
    smote_k_neighbors: 5

  # Chi tiết lựa chọn đặc trưng (Feature selection)
  feature_selection:
    top_k_features: null
    feature_selection_metric: "RF_Importance"
    compute_feature_importance: false

# 3. CẤU HÌNH MÔ HÌNH XGBOOST (Model Hyperparameters)
model:
  name: "xgboost"
  params:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0.1
    min_child_weight: 1
    scale_pos_weight: 1.0           # 1.0 nếu dùng SMOTE; nếu không SMOTE có thể set 3.9
    eval_metric: "auc"
    random_state: 42
    n_jobs: -1
  early_stopping_rounds: 30

# 4. CẤU HÌNH THÍ NGHIỆM & KẾT QUẢ (Experiment & Reporting Settings)
experiment:
  output_dir: "results"
  save_model: true
  model_save_path: "models/saved/xgboost_churn.json"
  report_filename: "xgboost_ablation_report.md"
