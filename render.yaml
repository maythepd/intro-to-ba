services:
  - type: web
    name: babank-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m api.official_data --download && python -m api.export_bundle
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: OFFICIAL_DATA_DIR
        value: data/official/raw
