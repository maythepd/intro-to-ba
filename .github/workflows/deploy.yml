name: CI & Automated Web Deployment

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'models/saved/**'
      - 'results/**'
      - 'tests/**'
      - 'config/**'
      - 'api.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-build:
    name: Test & Build Production Bundle
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Serving Tests
        run: |
          python -m unittest tests/test_model_metrics.py

      - name: Set up Node.js 22 (Active LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

  deploy-to-render:
    name: Deploy to Cloud (Render / Webhook)
    needs: test-and-build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering cloud deployment on Render..."
          curl -X POST -f "${RENDER_DEPLOY_HOOK_URL}"
          echo "Deployment trigger sent successfully!"

      - name: Deployment Notice
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "No RENDER_DEPLOY_HOOK_URL secret found. If you connected GitHub repository directly to Render, Render auto-deploys automatically on git push."
