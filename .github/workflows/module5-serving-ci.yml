name: Module 5 Serving CI
on:
  pull_request:
    paths:
      - 'api/**'
      - 'models/**'
      - 'preprocessing/**'
      - 'frontend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'render.yaml'
      - '.github/workflows/module5-serving-ci.yml'
  workflow_dispatch:
jobs:
  validate-checkpoint-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt httpx httpx2
      - run: python -m api.prepare_module5 --download
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
