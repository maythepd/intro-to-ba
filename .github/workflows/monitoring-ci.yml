name: Module 7 Monitoring CI
on:
  pull_request:
    paths:
      - 'api/**'
      - 'monitoring/**'
      - 'demo_data/**'
      - 'tools/demo_artifact.py'
      - 'tools/prepare_demo_source.py'
      - 'tools/prepare_serving.py'
      - 'config/synthetic_outcome_v1.json'
      - 'config/monitoring.yaml'
      - 'frontend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-demo.txt'
      - 'requirements-serving.txt'
      - 'render.yaml'
      - '.github/workflows/monitoring-ci.yml'
  push:
    branches: [feature/module7-monitoring, demo]
  workflow_dispatch:
jobs:
  monitoring-and-ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: monitoring-test-only
          POSTGRES_DB: monitoring_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d monitoring_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MONITORING_TEST_DATABASE_URL: postgresql://postgres:monitoring-test-only@localhost:5432/monitoring_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-serving.txt -r requirements-demo.txt httpx2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kagglehub/datasets/maythepd/full-dataset-intro2ba
          key: kaggle-babank-release-3
      - run: python -m api.prepare_module5 --download
      - run: python -m tools.prepare_demo_source
      - run: python -m api.official_data --source data/full_dataset
      - run: python -m api.segmentation_service
      - run: python -m demo_data.generate --multiplier 10 --max-samples 10000 --seed 42
      - run: python -m demo_data.validate
        env:
          DATABASE_URL: sqlite:///artifacts/monitoring/ci-validation.sqlite3
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Preserve this fork's existing choice until its reviewed lockfile is committed.
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
